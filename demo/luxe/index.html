<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxe E-Commerce Catalog – Live Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdfbf7; color: #1c1917; line-height: 1.6; }
    .demo-bar { position: sticky; top: 0; z-index: 100; background: #292524; color: #fff; padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .demo-bar a { color: #fff; text-decoration: none; font-weight: 600; }
    .btn-back { padding: 0.35rem 0.8rem; background: rgba(255,255,255,0.15); border-radius: 4px; }
    .container { max-width: 1100px; margin: 0 auto; padding: 3rem 1.5rem; }
    .hero { text-align: center; margin-bottom: 3.5rem; }
    .hero h1 { font-family: "Georgia", serif; font-size: 3rem; margin-bottom: 0.5rem; }
    .hero p { color: #78716c; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem; }
    .product-card { background: #fff; border: 1px solid #e7e5e4; border-radius: 8px; overflow: hidden; }
    .product-card img { width: 100%; height: 260px; object-fit: cover; }
    .info { padding: 1.2rem; }
    .info h3 { font-size: 1.1rem; margin-bottom: 0.4rem; }
    .price { font-weight: 700; color: #b45309; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <div><strong>Luxe Catalog</strong> &bull; Zero Themes Live Demo</div>
    <a href="../../theme-detail.html?id=storefront-static" class="btn-back">&larr; Back to Theme Details</a>
  </div>
  <div class="container">
    <div class="hero">
      <h1>Luxe Goods</h1>
      <p>Artisanal leather, horology, and everyday luxury essentials.</p>
    </div>
    <div class="grid">
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=800&q=80" alt="Chronograph Watch">
        <div class="info">
          <h3>Heritage Chronograph</h3>
          <p class="price">$340.00</p>
        </div>
      </div>
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80" alt="Leather Folio">
        <div class="info">
          <h3>Full-Grain Leather Folio</h3>
          <p class="price">$185.00</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
