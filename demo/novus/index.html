<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Novus Creative Agency – Live Demo</title>
  <style>

    p.sub { font-size: 1.3rem; color: #888; max-width: 600px; margin-bottom: 2.5rem; }
    .btn-bold { background: #fff; color: #000; font-weight: 700; padding: 1rem 2.2rem; border-radius: 999px; text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em; transition: 0.2s; }

</head>

  <div class="demo-bar">
